# Light and dark themes for Streamlit's own widgets, tables and charts. Light: the colours of the existing app CSS
# (teal #1f6f78, canvas #f3f7f8, sidebar #eff4f5, ink #14264a, line #e3e8eb). Dark: the same colours through
# app/c1_theme.dark() (hue kept, lightness mirrored; the navy ink turns near-white), the mapping the app applies to its
# stylesheets in dark mode.
# The mode follows the browser: the settings menu, the operating system or the app's top-bar toggle.

[theme.light]
primaryColor = "#1f6f78"
backgroundColor = "#f3f7f8"
secondaryBackgroundColor = "#eff4f5"
textColor = "#14264a"
linkColor = "#1f6f78"
borderColor = "#e3e8eb"
dataframeBorderColor = "#e3e8eb"
dataframeHeaderBackgroundColor = "#eaf3f3"

[theme.light.sidebar]
backgroundColor = "#eff4f5"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#7bd3dd"
backgroundColor = "#1c282c"
secondaryBackgroundColor = "#1f2b2e"
textColor = "#e9eaec"
linkColor = "#7bd3dd"
borderColor = "#293136"
dataframeBorderColor = "#293136"
dataframeHeaderBackgroundColor = "#203333"

[theme.dark.sidebar]
backgroundColor = "#1f2b2e"
secondaryBackgroundColor = "#151a23"
